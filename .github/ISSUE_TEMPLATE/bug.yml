name: Bug
description: Report something that is broken or behaving incorrectly.
title: "[Bug] "
labels:
  - "type: bug"
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before filing. Reproduce on the latest `main`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/runtime, branch or commit.
      placeholder: "macOS 15, Chrome 130, commit d22411c"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant output. Redact secrets.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "p0 - critical (blocks everything)"
        - "p1 - high (major feature broken)"
        - "p2 - medium (workaround exists)"
        - "p3 - low (cosmetic)"
    validations:
      required: true
