AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Owner C detector stack (Python, JavaScript and runtime-version checks): read-only static-scan Lambda, an
  artifact parser fed by presigned uploads and S3 events, an X-Ray telemetry reader, a traced demo workload,
  and findings published to the shared findings-hub bus. Parses only; never executes client code.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: >-
      client CI -> presign fn -> PUT repo.zip + artifacts + manifest.json -> S3 event -> profile-parser fn;
      client X-Ray (read-only role) -> xray-parser fn; repo zip/files -> static-scan fn;
      all -> PutEvents findings-hub (detector.result.v1)
    must:
      - "all resources prefixed owner-c- & tagged owner=C (docs/aws_service_mapping_v1.6.md guardrails)"
      - "deploy in the same Region as owner D's findings-hub (ap-south-1); no cross-region calls"
      - "findings-hub bus is owned by owner D; this stack only publishes, never creates it"
      - "never execute client code or uploaded artifacts; fns parse only"
      - "PutEvents to a missing bus succeeds silently, so fns must DescribeEventBus first"
      - "artifact bucket name is fixed so the S3 notification can reference fns without a circular dependency"
    ref:
      - docs/ARCHITECTURE_FLOWS.md
      - docs/aws_service_mapping_v1.6.md
      - docs/research/category-1-decisions.md
      - docs/research/category-2-decisions.md
    owner: Medhansh-741

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda zips built by scripts/build-owner-c-lambda.sh.
  CodeKey:
    Type: String
    Description: S3 key of owner-c-detectors.zip (Python Lambdas).
  DemoCodeKey:
    Type: String
    Description: S3 key of owner-c-xray-demo.zip (traced demo Lambda).
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the account's GitHub OIDC provider (token.actions.githubusercontent.com). An account allows one per URL,
      so set "false" when another stack or a hand-made provider already exists.
  ClientRepoSubs:
    Type: CommaDelimitedList
    Default: "repo:AWS-env@340005856/environmental-hacks@1409417988:*"
    Description: >-
      GitHub OIDC `sub` patterns allowed to assume the client upload role. GitHub identifies repositories by an
      immutable subject: read it with `gh api repos/<owner>/<repo>/actions/oidc/customization/sub` and add
      `<sub_claim_prefix>:*`. Onboarding a client is a reviewed stack update that appends one entry here.

  FindingsBusName:
    Type: String
    Default: findings-hub
    Description: Name of the existing EventBridge bus owned by owner D.
  ArtifactRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: ProfileParserInvokePermission
    Metadata:
      com.aws.cloudformation.Context:
        why: "landing zone for client-CI uploads (repo zip, profiler artifacts, manifest); parse-only"
        must:
          - "private; TLS only; expire objects to bound retention (auditor spec sec 6)"
          - "manifest.json under uploads/ triggers the parser, so clients upload it last"
        mutable: change-with-constraints
    Properties:
      BucketName: !Sub "owner-c-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: !Ref ArtifactRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ProfileParserFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: "uploads/" }
                  - { Name: suffix, Value: "manifest.json" }
      Tags:
        - { Key: owner, Value: C }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  ParseDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: owner-c-parse-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      Tags:
        - { Key: owner, Value: C }

  ParseDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: owner-c-parse-dlq-not-empty
      AlarmDescription: A detector invocation failed all retries and its event is waiting in owner-c-parse-dlq. No notification target is attached; check the alarm state.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt ParseDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: owner, Value: C }

  # ---- static scan ---------------------------------------------------------------
  StaticScanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-c-static-scan
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: C }

  StaticScanRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "least-privilege exec role for static-scan fn"
        must:
          - "only: write own logs, PutEvents to findings-hub, GetObject on uploads/ prefix"
    Properties:
      RoleName: owner-c-static-scan-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-c-static-scan
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${StaticScanLogGroup.Arn}:*"
              - Effect: Allow
                Action: [events:PutEvents, events:DescribeEventBus]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::owner-c-artifacts-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Tags:
        - { Key: owner, Value: C }

  StaticScanFunction:
    Type: AWS::Lambda::Function
    DependsOn: StaticScanLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "runs every static check (Python, JavaScript/TypeScript, runtime versions) and publishes contract v1 results; arm64 for lower cost"
        must:
          - "fixed name owner-c-static-scan per guardrail naming"
          - "code zip from scripts/build-owner-c-lambda.sh (zip root holds owner_c/ plus tree-sitter arm64 wheels)"
    Properties:
      FunctionName: owner-c-static-scan
      Runtime: python3.13
      Architectures: [arm64]
      Handler: owner_c.aws.handler.lambda_handler
      Role: !GetAtt StaticScanRole.Arn
      MemorySize: 1024
      Timeout: 120
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
      LoggingConfig:
        LogGroup: !Ref StaticScanLogGroup
      Tags:
        - { Key: owner, Value: C }

  # ---- profile parser (uploads + S3 manifest trigger) ----------------------------------
  ProfileParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-c-profile-parser
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: C }

  ProfileParserRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "least-privilege exec role for profile-parser fn (py-spy, memray, V8 CPU/heap artifact confirmation)"
        must:
          - "only: write own logs, publish to findings-hub, read uploads/ prefix, send failures to the DLQ"
    Properties:
      RoleName: owner-c-profile-parser-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-c-profile-parser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ProfileParserLogGroup.Arn}:*"
              - Effect: Allow
                Action: [events:PutEvents, events:DescribeEventBus]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::owner-c-artifacts-${AWS::AccountId}-${AWS::Region}/uploads/*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ParseDlq.Arn
      Tags:
        - { Key: owner, Value: C }

  ProfileParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ProfileParserLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "parse-only: confirms static candidates with artifacts uploaded by client CI; triggered by manifest.json"
        must:
          - "never execute client code or artifacts; JSON parse only, size-capped"
          - "failed async invocations land in owner-c-parse-dlq"
    Properties:
      FunctionName: owner-c-profile-parser
      Runtime: python3.13
      Architectures: [arm64]
      Handler: owner_c.aws.profile_handler.lambda_handler
      Role: !GetAtt ProfileParserRole.Arn
      MemorySize: 1024
      Timeout: 120
      DeadLetterConfig:
        TargetArn: !GetAtt ParseDlq.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
      LoggingConfig:
        LogGroup: !Ref ProfileParserLogGroup
      Tags:
        - { Key: owner, Value: C }

  ProfileParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProfileParserFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::owner-c-artifacts-${AWS::AccountId}-${AWS::Region}"

  # ---- upload handshake ------------------------------------------------------------------
  PresignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-c-presign
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: C }

  PresignRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "signs 15-minute PUT URLs for the client's repo zip, artifacts and manifest"
        must:
          - "presigned URLs inherit this role: PutObject on uploads/ only, nothing else"
    Properties:
      RoleName: owner-c-presign-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-c-presign
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${PresignLogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::owner-c-artifacts-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Tags:
        - { Key: owner, Value: C }

  PresignFunction:
    Type: AWS::Lambda::Function
    DependsOn: PresignLogGroup
    Properties:
      FunctionName: owner-c-presign
      Runtime: python3.13
      Architectures: [arm64]
      Handler: owner_c.aws.presign_handler.lambda_handler
      Role: !GetAtt PresignRole.Arn
      MemorySize: 256
      Timeout: 15
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Sub "owner-c-artifacts-${AWS::AccountId}-${AWS::Region}"
      LoggingConfig:
        LogGroup: !Ref PresignLogGroup
      Tags:
        - { Key: owner, Value: C }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: "lets a client's GitHub Actions job prove its identity to AWS with no stored secrets"
        must:
          - "audience sts.amazonaws.com only"
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: owner, Value: C }

  ClientUploadRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "assumed by an allowlisted client repository through GitHub OIDC to ask owner-c-presign for upload URLs"
        must:
          - "trust only the sub patterns in ClientRepoSubs and audience sts.amazonaws.com"
          - "permission is lambda:InvokeFunction on owner-c-presign and nothing else"
    Properties:
      RoleName: owner-c-client-upload
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Ref ClientRepoSubs
      Policies:
        - PolicyName: invoke-owner-c-presign
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PresignFunction.Arn
      Tags:
        - { Key: owner, Value: C }

  # ---- X-Ray telemetry reader (read-only) ----------------------------------------------------
  XrayParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-c-xray-parser
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: C }

  XrayParserRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "reads existing X-Ray traces (own account or a client's read-only role) to confirm JS-01"
        must:
          - "read-only: GetTraceSummaries/BatchGetTraces; AssumeRole only into roles named owner-c-xray-reader"
    Properties:
      RoleName: owner-c-xray-parser-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-c-xray-parser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${XrayParserLogGroup.Arn}:*"
              - Effect: Allow
                Action: [events:PutEvents, events:DescribeEventBus]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::owner-c-artifacts-${AWS::AccountId}-${AWS::Region}/uploads/*"
              - Effect: Allow
                Action: [xray:GetTraceSummaries, xray:BatchGetTraces]
                Resource: "*"
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/owner-c-xray-reader"
      Tags:
        - { Key: owner, Value: C }

  XrayParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: XrayParserLogGroup
    Properties:
      FunctionName: owner-c-xray-parser
      Runtime: python3.13
      Architectures: [arm64]
      Handler: owner_c.aws.xray_handler.lambda_handler
      Role: !GetAtt XrayParserRole.Arn
      MemorySize: 1024
      Timeout: 120
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
      LoggingConfig:
        LogGroup: !Ref XrayParserLogGroup
      Tags:
        - { Key: owner, Value: C }

  # ---- traced demo workload (serial vs parallel awaits) -------------------------------------
  XrayDemoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-c-xray-demo
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: C }

  XrayDemoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-c-xray-demo-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-c-xray-demo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${XrayDemoLogGroup.Arn}:*"
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"
      Tags:
        - { Key: owner, Value: C }

  XrayDemoFunction:
    Type: AWS::Lambda::Function
    DependsOn: XrayDemoLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "real X-Ray traces of serial vs parallel awaits for tests and demos of the JS-01 route"
        must:
          - "Active tracing; invoked only by us; makes no downstream calls"
    Properties:
      FunctionName: owner-c-xray-demo
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt XrayDemoRole.Arn
      MemorySize: 256
      Timeout: 30
      TracingConfig:
        Mode: Active
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref DemoCodeKey
      LoggingConfig:
        LogGroup: !Ref XrayDemoLogGroup
      Tags:
        - { Key: owner, Value: C }

Outputs:
  StaticScanFunctionArn:
    Value: !GetAtt StaticScanFunction.Arn
  ProfileParserFunctionArn:
    Value: !GetAtt ProfileParserFunction.Arn
  PresignFunctionArn:
    Value: !GetAtt PresignFunction.Arn
  XrayParserFunctionArn:
    Value: !GetAtt XrayParserFunction.Arn
  XrayDemoFunctionArn:
    Value: !GetAtt XrayDemoFunction.Arn
  ClientUploadRoleArn:
    Value: !GetAtt ClientUploadRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ParseDlqUrl:
    Value: !Ref ParseDlq
