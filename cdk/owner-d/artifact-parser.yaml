AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Owner D artifact parser: S3 "Object Created" events for uploads/ in owner-d-artifacts-<account>-<region> (stack
  owner-d-artifact-upload) -> EventBridge rule on the default bus -> owner-d-artifact-parser reads the artifact
  (size-capped, parse-only), evaluates Owner D artifact-mode checks (TST-12) and publishes detector.result.v1
  events to findings-hub. Reuses the owner-d-telemetry zip. See detectors/owner-d/README.md.

Metadata:
  com.aws.cloudformation.Context:
    arch: >-
      client CI -> presigned POST -> S3 owner-d-artifacts uploads/<repo>/<sha>/<run>-<attempt>/<name> ->
      EventBridge default bus (aws.s3 Object Created) -> rule owner-d-artifact-uploaded -> owner-d-artifact-parser
      -> validate_pair -> PutEvents findings-hub -> owner-d-findings-writer -> DynamoDB owner-d-findings;
      failed async invocations (after 2 retries) -> owner-d-artifact-parser-dlq
    must:
      - "all resources prefixed owner-d- & tagged owner=D (docs/aws_service_mapping_v1.6.md guardrails)"
      - "ap-south-1 only (project selected Region): the ProjectRegionOnly rule refuses any other Region"
      - "read-only toward artifacts: s3:GetObject on uploads/* only; never executes uploaded content"
      - "the artifact bucket and the findings-hub bus exist outside this stack"
      - "no reserved concurrency: the project's Lambda concurrency quota is 10, so Lambda refuses any reservation"
    ref:
      - docs/ARCHITECTURE_FLOWS.md
      - detectors/owner-d/README.md
      - hub/README.md
    owner: Prakharrdev

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket (in this Region) holding the zip built by scripts/build-owner-d-telemetry.sh.
  CodeKey:
    Type: String
    Description: S3 key of the owner-d-telemetry zip (it contains owner_d.aws.artifact_handler).
  FindingsBusName:
    Type: String
    Default: findings-hub
    Description: Existing EventBridge bus read by the owner-d-findings-hub writer.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7]

Rules:
  ProjectRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-south-1]
        AssertDescription: Deploy in the project Region (ap-south-1) only.

Resources:
  # ---- failure handling ----------------------------------------------------------------------
  ParserDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: owner-d-artifact-parser-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      Tags:
        - { Key: owner, Value: D }

  ParserDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: owner-d-artifact-parser-dlq-not-empty
      AlarmDescription: >-
        An artifact parse failed on an AWS error (GetObject or PutEvents) after retries; the S3 event is in
        owner-d-artifact-parser-dlq. Bad client artifacts are refused in the logs instead and never land here.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt ParserDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: owner, Value: D }

  # ---- function ------------------------------------------------------------------------------
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-d-artifact-parser
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: D }

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-d-artifact-parser-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-d-artifact-parser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ParserLogGroup.Arn}:*"
              - Sid: ReadUploadsOnly
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::owner-d-artifacts-${AWS::AccountId}-${AWS::Region}/uploads/*"
              - Sid: PublishToFindingsHub
                Effect: Allow
                Action: [events:PutEvents, events:DescribeEventBus]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
              - Sid: FailedInvocations
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ParserDlq.Arn
      Tags:
        - { Key: owner, Value: D }

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: owner-d-artifact-parser
      Description: Client-CI artifacts in owner-d-artifacts uploads/ -> Owner D artifact checks (TST-12) -> findings-hub.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: owner_d.aws.artifact_handler.lambda_handler
      Role: !GetAtt ParserRole.Arn
      MemorySize: 256
      Timeout: 60
      DeadLetterConfig: { TargetArn: !GetAtt ParserDlq.Arn }
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
          ALLOWED_REGION: ap-south-1
          ARTIFACT_BUCKET: !Sub "owner-d-artifacts-${AWS::AccountId}-${AWS::Region}"
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Tags:
        - { Key: owner, Value: D }

  ParserInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ParserFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600

  # ---- trigger -------------------------------------------------------------------------------
  UploadedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: owner-d-artifact-uploaded
      Description: S3 Object Created under uploads/ in owner-d-artifacts -> owner-d-artifact-parser.
      EventBusName: default
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Sub "owner-d-artifacts-${AWS::AccountId}-${AWS::Region}"]
          object:
            key: [{ prefix: uploads/ }]
      Targets:
        - Id: owner-d-artifact-parser
          Arn: !GetAtt ParserFunction.Arn

  RuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UploadedRule.Arn

Outputs:
  ParserFunctionName:
    Value: !Ref ParserFunction
  UploadedRuleName:
    Value: !Ref UploadedRule
  ParserDlqUrl:
    Value: !Ref ParserDlq
