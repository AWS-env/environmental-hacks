AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Owner D findings-hub read API: GET /repos/{owner}/{repo}/scans/{scan_id} (API Gateway HTTP API) ->
  owner-d-hub-api queries the owner-d-findings table and returns a persisted public-repository scan (results
  published by scan-api, source owner-<x>.scan-api) with its findings. Client-CI upload and telemetry results
  are never served. Read-only. See hub/README.md.

Metadata:
  com.aws.cloudformation.Context:
    arch: >-
      browser/dashboard -> HTTP API GET /repos/{owner}/{repo}/scans/{scan_id} -> owner-d-hub-api ->
      DynamoDB Query pk = SCAN#<hash(repository_id, scan_id)> on owner-d-findings -> only .scan-api results
    must:
      - "all resources prefixed owner-d- & tagged owner=D (docs/aws_service_mapping_v1.6.md guardrails)"
      - "ap-south-1 only (project selected Region): the ProjectRegionOnly rule refuses any other Region"
      - "read-only: dynamodb:Query on the findings table only (no GSI, no Scan, no writes)"
      - "public-scan rule: serve only results whose source is owner-<x>.scan-api, looked up by scan-api UUID"
      - "the findings table exists outside this stack (owner-d-findings-hub)"
    ref:
      - hub/README.md
      - infra/scan-api/README.md
    owner: Prakharrdev

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket (in this Region) holding the zip built by scripts/build-owner-d-hub.sh.
  CodeKey:
    Type: String
    Description: S3 key of the owner-d-findings-hub zip (it contains findings_hub.api).
  FindingsTableName:
    Type: String
    Default: owner-d-findings
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Browser origin allowed by CORS (e.g. the Amplify app URL). "*" serves any origin.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14]

Rules:
  ProjectRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-south-1]
        AssertDescription: Deploy in the project Region (ap-south-1) only.

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-d-hub-api
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: D }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-d-hub-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: owner-d-hub-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Sid: QueryFindingsTable
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FindingsTableName}"
      Tags:
        - { Key: owner, Value: D }

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: owner-d-hub-api
      Description: GET /repos/{owner}/{repo}/scans/{scan_id} -> public (scan-api) results and findings from owner-d-findings.
      Runtime: python3.13
      Architectures: [arm64]
      Handler: findings_hub.api.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTableName
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Tags:
        - { Key: owner, Value: D }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: owner-d-hub-api
      Description: Read-only findings-hub API for public-repository scans.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, OPTIONS]
        MaxAge: 3600
      Tags:
        owner: D

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  GetScanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /repos/{owner}/{repo}/scans/{scan_id}
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: GetScanRoute
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Tags:
        owner: D

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/repos/*"

Outputs:
  HubApiUrl:
    Description: "Base URL; GET {HubApiUrl}/repos/<owner>/<repo>/scans/<scan_id>"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionName:
    Value: !Ref ApiFunction
