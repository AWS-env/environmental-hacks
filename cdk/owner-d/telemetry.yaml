AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Owner D read-only telemetry route: owner-d-telemetry-analyzer (CloudWatch metrics), owner-d-log-analyzer
  (CloudWatch Logs / Logs Insights) and owner-d-trace-analyzer (X-Ray) read existing telemetry, optionally
  through the read-only role owner-d-telemetry-readonly (simulated client role), evaluate Owner D contract v1
  detectors and publish detector.result.v1 events to the findings-hub bus. On-demand only; no VPC or NAT.

Metadata:
  com.aws.cloudformation.Context:
    arch: >-
      invoke (async or sync) -> owner-d-{telemetry,log,trace}-analyzer -> STS AssumeRole owner-d-telemetry-readonly
      (optional) -> CloudWatch GetMetricData/ListMetrics | Logs DescribeLogGroups/StartQuery | X-Ray traces (read)
      -> PutEvents findings-hub (detector.result.v1) -> owner-d-findings-writer -> DynamoDB owner-d-findings;
      failed async invocations -> owner-d-telemetry-dlq
    must:
      - "all resources prefixed owner-d- & tagged owner=D (docs/aws_service_mapping_v1.6.md guardrails)"
      - "ap-south-1 only (project selected Region): the ProjectRegionOnly rule refuses any other Region"
      - "read-only toward telemetry: no Put/Create/Delete on CloudWatch, Logs or X-Ray; queries are bounded"
      - "findings-hub bus and the findings writer exist outside this stack (owner-d-findings-hub)"
      - "no reserved concurrency by default: the project's Lambda concurrency quota is 10, so Lambda refuses any reservation"
      - "owner-d-telemetry-readonly requires sts:ExternalId; the value is a NoEcho parameter, never committed"
    ref:
      - docs/ARCHITECTURE_FLOWS.md
      - detectors/owner-d/README.md
      - hub/README.md
    owner: Prakharrdev

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket (in this Region) holding the zip built by scripts/build-owner-d-telemetry.sh.
  CodeKey:
    Type: String
    Description: S3 key of the zip; the content-hashed name makes every build redeploy.
  FindingsBusName:
    Type: String
    Default: findings-hub
    Description: Existing EventBridge bus read by the owner-d-findings-hub writer.
  LogQueryPattern:
    Type: String
    Default: /aws/lambda/owner-d-*
    AllowedPattern: "[A-Za-z0-9_./#*-]+"
    Description: >-
      Log group name or "*" pattern that Logs Insights may query. Enforced in code (LOG_GROUP_ALLOWLIST) and
      as the logs:StartQuery resource in both the analyzer and read-only role policies.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7]
  ReadOnlyExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 1224
    AllowedPattern: "[\\w+=,.@:/-]+"
    ConstraintDescription: 16-1224 characters from the STS ExternalId set (letters, digits, _+=,.@:/-).
    Description: >-
      sts:ExternalId that owner-d-telemetry-readonly requires in its trust policy. No default: generate one
      locally (see detectors/owner-d/README.md) and never commit it. The analyzers get it as
      READONLY_EXTERNAL_ID and send it only when assuming this stack's read-only role.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: >-
      Per-function reserved concurrency. 0 = no reservation (required while the project's concurrency quota
      is 10, because Lambda must keep 10 unreserved). Handlers already bound their own work.

Rules:
  ProjectRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-south-1]
        AssertDescription: Deploy in the project Region (ap-south-1) only.

Conditions:
  Reserve: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:
  # ---- failure handling ----------------------------------------------------------------------
  TelemetryDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: owner-d-telemetry-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      Tags:
        - { Key: owner, Value: D }

  TelemetryDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: owner-d-telemetry-dlq-not-empty
      AlarmDescription: >-
        An async telemetry analyzer invocation failed (no retries) and its event is in owner-d-telemetry-dlq.
        No notification target is attached; check the alarm state and the analyzer logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt TelemetryDlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - { Key: owner, Value: D }

  # ---- logs --------------------------------------------------------------------------------------
  TelemetryAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-d-telemetry-analyzer
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: D }

  LogAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-d-log-analyzer
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: D }

  TraceAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/owner-d-trace-analyzer
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: owner, Value: D }

  # ---- IAM ---------------------------------------------------------------------------------------
  AnalyzerCommonPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "what every analyzer needs besides its own reads: publish to findings-hub, DLQ, tracing, the read-only role"
    Properties:
      ManagedPolicyName: owner-d-telemetry-analyzer-common
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishToFindingsHub
            Effect: Allow
            Action: [events:PutEvents, events:DescribeEventBus]
            Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
          - Sid: AssumeReadOnlyRoleOnly
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/owner-d-telemetry-readonly"
          - Sid: FailedInvocations
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt TelemetryDlq.Arn
          - Sid: ActiveTracing
            Effect: Allow
            Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
            Resource: "*"

  TelemetryAnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-d-telemetry-analyzer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      ManagedPolicyArns: [!Ref AnalyzerCommonPolicy]
      Policies:
        - PolicyName: owner-d-telemetry-analyzer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${TelemetryAnalyzerLogGroup.Arn}:*"
              - Sid: ReadMetrics  # no resource-level permissions exist for these actions
                Effect: Allow
                Action: [cloudwatch:GetMetricData, cloudwatch:ListMetrics]
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": ap-south-1
      Tags:
        - { Key: owner, Value: D }

  LogAnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-d-log-analyzer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      ManagedPolicyArns: [!Ref AnalyzerCommonPolicy]
      Policies:
        - PolicyName: owner-d-log-analyzer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogAnalyzerLogGroup.Arn}:*"
              - Sid: ListLogGroups
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:ListTagsForResource]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Sid: QueryAllowlistedLogGroups
                Effect: Allow
                Action: logs:StartQuery
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogQueryPattern}:*"
              - Sid: QueryResults  # GetQueryResults/StopQuery have no resource-level permissions
                Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery]
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": ap-south-1
      Tags:
        - { Key: owner, Value: D }

  TraceAnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: owner-d-trace-analyzer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      ManagedPolicyArns: [!Ref AnalyzerCommonPolicy]
      Policies:
        - PolicyName: owner-d-trace-analyzer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${TraceAnalyzerLogGroup.Arn}:*"
              - Sid: ReadTraces  # no resource-level permissions exist for these actions
                Effect: Allow
                Action: [xray:GetTraceSummaries, xray:BatchGetTraces]
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": ap-south-1
      Tags:
        - { Key: owner, Value: D }

  ReadOnlyRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "simulates the client's read-only telemetry role inside our project (STS AssumeRole path)"
        must:
          - "trusted only by the three analyzer roles, and only with the sts:ExternalId from ReadOnlyExternalId"
          - "read-only actions only; 1-hour max session"
    Properties:
      RoleName: owner-d-telemetry-readonly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                "aws:PrincipalArn":
                  - !GetAtt TelemetryAnalyzerRole.Arn
                  - !GetAtt LogAnalyzerRole.Arn
                  - !GetAtt TraceAnalyzerRole.Arn
              StringEquals:
                "sts:ExternalId": !Ref ReadOnlyExternalId
      Policies:
        - PolicyName: owner-d-telemetry-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMetricsLogsTraces
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - logs:GetQueryResults
                  - logs:StopQuery
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion": ap-south-1
              - Sid: ListLogGroups
                Effect: Allow
                Action: [logs:DescribeLogGroups, logs:ListTagsForResource]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Sid: QueryAllowlistedLogGroups
                Effect: Allow
                Action: logs:StartQuery
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogQueryPattern}:*"
      Tags:
        - { Key: owner, Value: D }

  # ---- functions ---------------------------------------------------------------------------------
  TelemetryAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: owner-d-telemetry-analyzer
      Description: Read-only CloudWatch metrics -> Owner D checks (INF-01) -> findings-hub.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: owner_d.aws.telemetry_handler.lambda_handler
      Role: !GetAtt TelemetryAnalyzerRole.Arn
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: !If [Reserve, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      TracingConfig: { Mode: Active }
      DeadLetterConfig: { TargetArn: !GetAtt TelemetryDlq.Arn }
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
          ALLOWED_REGION: ap-south-1
          READONLY_ROLE_ARN: !GetAtt ReadOnlyRole.Arn
          READONLY_EXTERNAL_ID: !Ref ReadOnlyExternalId
      LoggingConfig:
        LogGroup: !Ref TelemetryAnalyzerLogGroup
      Tags:
        - { Key: owner, Value: D }

  LogAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: owner-d-log-analyzer
      Description: Read-only CloudWatch Logs (DescribeLogGroups, bounded Logs Insights) -> Owner D checks -> findings-hub.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: owner_d.aws.log_handler.lambda_handler
      Role: !GetAtt LogAnalyzerRole.Arn
      MemorySize: 256
      Timeout: 300  # one Logs Insights query (<= 240 s) at a time plus evaluation and publishing
      ReservedConcurrentExecutions: !If [Reserve, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      TracingConfig: { Mode: Active }
      DeadLetterConfig: { TargetArn: !GetAtt TelemetryDlq.Arn }
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
          ALLOWED_REGION: ap-south-1
          READONLY_ROLE_ARN: !GetAtt ReadOnlyRole.Arn
          READONLY_EXTERNAL_ID: !Ref ReadOnlyExternalId
          LOG_GROUP_ALLOWLIST: !Ref LogQueryPattern
      LoggingConfig:
        LogGroup: !Ref LogAnalyzerLogGroup
      Tags:
        - { Key: owner, Value: D }

  TraceAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: owner-d-trace-analyzer
      Description: Read-only X-Ray traces (bounded, batches of 5) -> Owner D checks -> findings-hub.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: owner_d.aws.trace_handler.lambda_handler
      Role: !GetAtt TraceAnalyzerRole.Arn
      MemorySize: 256
      Timeout: 120
      ReservedConcurrentExecutions: !If [Reserve, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      TracingConfig: { Mode: Active }
      DeadLetterConfig: { TargetArn: !GetAtt TelemetryDlq.Arn }
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          FINDINGS_BUS_NAME: !Ref FindingsBusName
          ALLOWED_REGION: ap-south-1
          READONLY_ROLE_ARN: !GetAtt ReadOnlyRole.Arn
          READONLY_EXTERNAL_ID: !Ref ReadOnlyExternalId
      LoggingConfig:
        LogGroup: !Ref TraceAnalyzerLogGroup
      Tags:
        - { Key: owner, Value: D }

  # Async invocations are not retried: a retry would re-run Logs Insights (billed per GB scanned).
  TelemetryAnalyzerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref TelemetryAnalyzerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  LogAnalyzerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref LogAnalyzerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  TraceAnalyzerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref TraceAnalyzerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

Outputs:
  TelemetryAnalyzerFunctionName:
    Value: !Ref TelemetryAnalyzerFunction
  LogAnalyzerFunctionName:
    Value: !Ref LogAnalyzerFunction
  TraceAnalyzerFunctionName:
    Value: !Ref TraceAnalyzerFunction
  ReadOnlyRoleArn:
    Description: >-
      Pass as role_arn in analyzer events to read through the simulated client role; the analyzers add the
      ExternalId themselves.
    Value: !GetAtt ReadOnlyRole.Arn
  TelemetryDlqUrl:
    Value: !Ref TelemetryDlq
