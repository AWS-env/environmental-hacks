# Synthetic INF-02 fixture: workloads that are autoscaled or not statically replicated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defaulted
spec:
  template:
    spec:
      containers:
        - name: app
          image: example/app:1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: example/app:1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: app
          image: example/frontend:1.0
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: consumer
          image: example/consumer:1.0
---
# KEDA defaults scaleTargetRef.kind to Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: consumer
spec:
  scaleTargetRef:
    name: consumer
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.example/queue
        queueLength: "5"
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend-7d9f
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
spec:
  replicas: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
    - port: 80
