# Synthetic fixture (INF04-03): the OpenAPI definition lives outside the template and may reference any
# function, so functions are not judged; the unreferenced queue still is.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      DefinitionUri: openapi.yaml
  ListItems:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.handler
      CodeUri: src/
  ScratchQueue:
    Type: AWS::SQS::Queue
