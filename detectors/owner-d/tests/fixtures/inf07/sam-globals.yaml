# Synthetic fixture (INF07-01): SAM Globals pin every function to x86_64.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
Resources:
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.handler
      CodeUri: src/
  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: export.handler
      CodeUri: src/
      Architectures: [arm64]
