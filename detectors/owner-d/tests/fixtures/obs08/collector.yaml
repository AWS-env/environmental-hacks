# Synthetic fixture (OBS-08): ADOT collector scraping Prometheus targets into AMP.
receivers:
  prometheus:
    config:
      global:
        scrape_interval: 1m
      scrape_configs:
        - job_name: app
          scrape_interval: 1s
          static_configs:
            - targets: ["app:9090"]
        - job_name: node
          static_configs:
            - targets: ["node:9100"]
exporters:
  prometheusremotewrite:
    endpoint: https://aps-workspaces.ap-south-1.amazonaws.com/workspaces/ws-1234abcd/api/v1/remote_write
    auth:
      authenticator: sigv4auth
extensions:
  sigv4auth:
    region: ap-south-1
service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
