# Synthetic fixture for OBS-12: the same launches with an instrumentation selection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    spec:
      containers:
        - name: orders
          image: example/orders:1.4.2
          command: ["opentelemetry-instrument", "python", "app.py"]
          env:
            - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
              value: sqlite3,urllib,asyncio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          image: example/web:2.0.0
          env:
            - name: NODE_OPTIONS
              value: --require @opentelemetry/auto-instrumentations-node/register
            - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
              value: http,express,pg
---
services:
  api:
    image: example/api:3.1.0
    environment:
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: dns,net
  worker:
    image: example/worker:3.1.0
    command: opentelemetry-instrument --python_disabled_instrumentations=sqlite3 celery -A tasks worker
