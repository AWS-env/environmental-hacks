# Synthetic fixture for OBS-13: probed workloads whose probes produce no kept spans.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          image: example/worker:1.0.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: healthz,ready
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiet
spec:
  template:
    spec:
      containers:
        - name: quiet
          image: example/quiet:1.0.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_TRACES_EXPORTER
              value: none
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
        - name: plain
          image: example/plain:1.0.0
          livenessProbe:
            httpGet:
              path: /ping
              port: 8001
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  template:
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.110.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://gateway:4317
          livenessProbe:
            httpGet:
              path: /
              port: 13133
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-runner
spec:
  containers:
    - name: runner
      image: example/runner:1.0.0
      env:
        - name: OTEL_TRACES_EXPORTER
          value: otlp
      startupProbe:
        httpGet:
          path: /startup
          port: 8000
      livenessProbe:
        tcpSocket:
          port: 8000
      readinessProbe:
        exec:
          command: [cat, /tmp/ready]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
spec:
  template:
    spec:
      containers:
        - name: ledger
          image: example/ledger:1.0.0
          env:
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector:4318/v1/traces
          # Probe spans are kept on purpose for the uptime report.
          # noqa: OBS-13
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
