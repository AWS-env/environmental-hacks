# Synthetic fixture for OBS-13: the same gateway with a filter that drops successful probe spans.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
  filter/probes:
    error_mode: ignore
    trace_conditions:
      - span.attributes["url.path"] == "/healthz" and span.attributes["http.response.status_code"] < 400
      - IsMatch(span.name, "GET /ready.*") and span.status.code != STATUS_CODE_ERROR
      - IsMatch(span.attributes["http.route"], "^/actuator/health")

exporters:
  otlp/backend:
    endpoint: tempo.example.com:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/probes, batch]
      exporters: [otlp/backend]
