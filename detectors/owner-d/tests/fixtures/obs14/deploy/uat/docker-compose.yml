    image: example/api:1.0
    environment:
      # noqa: OBS-14
      OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
  other-rule:
    image: example/api:1.0
    environment:
      # noqa: E501
      OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
  declared:
