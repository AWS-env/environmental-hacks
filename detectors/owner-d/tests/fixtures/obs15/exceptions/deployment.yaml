# Synthetic fixture (OBS15-03): OTLP bridge and a marked overlap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridged
spec:
  template:
    spec:
      containers:
        - name: app
          image: example.com/bridged:1
        - name: datadog-agent
          image: datadog/agent:7
          env:
            - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT
              value: "0.0.0.0:4317"
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.102.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marked
spec:
  template:
    spec:
      containers:
        - name: app
          image: example.com/marked:1
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.102.0
        # noqa: OBS-15 (X-Ray SDK services still send UDP segments here)
        - name: xray
          image: amazon/aws-xray-daemon:3.3.12
