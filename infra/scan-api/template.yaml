AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Async scan API for the frontend: API Gateway HTTP API -> api Lambda (POST /scans queues, GET /scans/{scan_id}
  polls) -> worker Lambda (async) downloads a public GitHub repo tarball, runs the read-only scanner and stores
  status.json/report.json in a private S3 bucket that expires them after 7 days. Never executes scanned code.
  See infra/scan-api/README.md.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket (in this Region) holding the zip built by scripts/build-scan-api-lambda.sh.
  CodeKey:
    Type: String
    Description: S3 key of the zip; use a content-addressed key so a new build updates both functions.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin allowed by CORS (e.g. https://app.example.com). "*" is for the demo only.
  RetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Days before scans/<id>/status.json and report.json expire.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14]
  FindingsBusName:
    Type: String
    Default: findings-hub
    AllowedPattern: "[A-Za-z0-9._-]{0,256}"
    Description: >-
      Owner D findings-hub EventBridge bus (same project and Region). The worker publishes each validated
      result there after saving report.json; empty turns publishing off.
  WorkerReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    Description: >-
      Concurrent scans at most (caps cost). 0 = no reservation, for projects whose account concurrency
      quota is 10, where Lambda refuses any reservation (it must keep 10 unreserved).

Rules:
  ProjectRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-south-1]
        AssertDescription: Deploy in the project Region (ap-south-1) only.

Conditions:
  ReserveWorker: !Not [!Equals [!Ref WorkerReservedConcurrency, 0]]
  PublishToHub: !Not [!Equals [!Ref FindingsBusName, ""]]

Resources:
  ScanBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-scans
            Status: Enabled
            Prefix: scans/
            ExpirationInDays: !Ref RetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Reports over 5 MB are served by a 15-minute presigned GET URL instead of inline.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Ref AllowedOrigin]
            MaxAge: 3600
      Tags:
        - { Key: component, Value: scan-api }

  ScanBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScanBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ScanBucket.Arn
              - !Sub "${ScanBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---- worker: downloads, extracts and scans one repository per invocation ----------------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/scan-api-worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: component, Value: scan-api }

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: scan-api-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${WorkerLogGroup.Arn}:*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ScanBucket.Arn}/scans/*"
              - !If
                - PublishToHub
                - Sid: PublishToFindingsHub
                  Effect: Allow
                  Action: events:PutEvents
                  Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${FindingsBusName}"
                - !Ref "AWS::NoValue"
      Tags:
        - { Key: component, Value: scan-api }

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: scan-api-worker
      Description: Scans one public GitHub repository (read-only) and writes report.json.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: scan_api.worker.handler
      Role: !GetAtt WorkerRole.Arn
      MemorySize: 3008
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      ReservedConcurrentExecutions: !If [ReserveWorker, !Ref WorkerReservedConcurrency, !Ref "AWS::NoValue"]
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          SCAN_BUCKET: !Ref ScanBucket
          FINDINGS_BUS_NAME: !Ref FindingsBusName
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
      Tags:
        - { Key: component, Value: scan-api }

  # No retries: the worker records its own failures, and a retry would repeat a costly scan.
  # Events throttled longer than an hour are dropped; the API then reports the scan as error.
  WorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  # ---- api: validates, queues, invokes the worker and serves status/report ------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/scan-api-http
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: component, Value: scan-api }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: scan-api-http
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ScanBucket.Arn}/scans/*"
              # Lets GetObject on a missing key return 404 (NoSuchKey) instead of 403.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ScanBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix": "scans/*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn
      Tags:
        - { Key: component, Value: scan-api }

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: scan-api-http
      Description: POST /scans and GET /scans/{scan_id} for the frontend.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: scan_api.api.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          SCAN_BUCKET: !Ref ScanBucket
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
          WORKER_TIMEOUT_SECONDS: "900"
          WORKER_MAX_EVENT_AGE_SECONDS: "3600"
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Tags:
        - { Key: component, Value: scan-api }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: scan-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 3600
      Tags:
        component: scan-api

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  PostScanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /scans
      Target: !Sub "integrations/${ApiIntegration}"

  GetScanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /scans/{scan_id}
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [PostScanRoute, GetScanRoute]
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        "POST /scans":
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 1
      Tags:
        component: scan-api

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/scans*"

Outputs:
  ScanApiUrl:
    Description: SCAN_API_URL for the frontend.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ScanBucketName:
    Value: !Ref ScanBucket
  WorkerFunctionName:
    Value: !Ref WorkerFunction
