# Amplify Hosting build spec for the Next.js app in web/ (monorepo: appRoot points here).
# Next 16 needs Node 20.9+, so pick Node 22 from the image's nvm before installing.
# NEXT_PUBLIC_SCAN_API_URL and NEXT_PUBLIC_HUB_API_URL are inlined at build time: set them
# on the Amplify app (App settings > Environment variables), see README.md.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
